name: CI

on:
  pull_request:
  push:
    branches: ["**"]

# The workflow only reads the repository; no job writes to GitHub.
permissions:
  contents: read

env:
  # uv.lock is the single source of truth for what CI installs. `--frozen`
  # refuses to resolve anything that is not in the lockfile, so a dependency
  # bump has to come with a regenerated lock (`uv lock`). Bump UV_VERSION
  # together with the local toolchain.
  UV_VERSION: "0.8.17"
  # Extras that make up the CI baseline (mirrors docs/about/contributing.md).
  SYNC_EXTRAS: "--extra dev --extra office --extra images --extra magic --extra llm --extra api"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with requires-python / classifiers in pyproject.toml.
        python-version: ["3.10", "3.11", "3.12"]
    name: test (py${{ matrix.python-version }})
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"

      - name: Install locked dependencies
        run: |
          uv sync --frozen --python "${{ matrix.python-version }}" ${SYNC_EXTRAS}
          uv pip check --python .venv/bin/python

      - name: Run tests
        run: |
          uv run --frozen python -m pytest -q

      - name: Detection-quality gate (regex, hermetic)
        run: |
          # Deterministic, offline regression gate on the synthetic ground truth.
          # Regex-only requires no model downloads. A drop below the threshold means
          # a regex pattern or the validation/context-gating pipeline regressed.
          uv run --frozen python -m core.cli evaluate eval/datasets/synthetic_de.json \
            --engines regex --fail-under 0.80
          # English dataset exercises non-DE formats (e.g. IBANs containing letters).
          uv run --frozen python -m core.cli evaluate eval/datasets/synthetic_en.json \
            --engines regex --fail-under 0.95

      - name: Extraction-quality gate
        run: |
          # Verifies the file processors still pull the expected text (e.g. CSV
          # column-header context) out of the sample documents.
          uv run --frozen python -m core.cli eval-extraction eval/datasets/extraction/manifest.json \
            --fail-under 1.0

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"

      - name: Lockfile is in sync with pyproject.toml
        run: |
          # Fails fast with a clear message when pyproject.toml changed
          # without `uv lock`; every other job would otherwise fail on --frozen.
          uv lock --check

      - name: Install locked dev tools
        run: uv sync --frozen --python 3.12 --extra dev

      - name: Ruff
        run: |
          uv run --frozen ruff check core file_processors validators api analytics scripts tests eval
          uv run --frozen ruff format --check core file_processors validators api analytics scripts tests eval

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"

      - name: Install locked dependencies
        run: uv sync --frozen --python 3.12 ${SYNC_EXTRAS}

      - name: mypy
        run: |
          uv run --frozen python -m mypy

  i18n:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"

      - name: Install locked dev tools (babel)
        run: uv sync --frozen --python 3.12 --extra dev

      - name: Catalog drift + completeness gate
        run: |
          # Fails if core/cli.py or core/scan_reporting.py contain strings not yet
          # extracted into locales/base.pot, or if the de/en catalogs have
          # fuzzy/untranslated entries.
          uv run --frozen python scripts/update_catalog.py check

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"

      - name: Bandit
        run: |
          # Fail on medium+ severity and confidence findings.
          uvx bandit==1.9.4 -q -r core file_processors validators api analytics -x tests \
            --severity-level medium --confidence-level medium

      - name: pip-audit (locked dependency set)
        run: |
          # Audit exactly what uv.lock pins for the CI baseline, hashes included.
          # --no-deps: the export is already a complete, resolved set.
          uv export --frozen --format requirements-txt --no-emit-project ${SYNC_EXTRAS} \
            -o requirements-lock.txt
          uvx pip-audit==2.10.1 -r requirements-lock.txt --no-deps --progress-spinner off
